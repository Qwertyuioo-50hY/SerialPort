# Let CC Switch manage the real config.toml outside this repository.
# API keys must not be committed; the sample uses an environment variable.
model_provider = "custom"
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
disable_response_storage = true

[model_providers.custom]
name = "Software"
base_url = "https://api.mxwell.ai/v1"
wire_api = "responses"
requires_openai_auth = false
env_key = "SOFTWARE_API_KEY"
